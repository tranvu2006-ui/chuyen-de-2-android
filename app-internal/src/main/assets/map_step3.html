<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #F4F6F8; overflow: hidden; }
    #realMap { width: 100%; height: 100%; }

    .driver-marker-box {
      width: 42px; height: 42px; background: #FFF; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      border: 3px solid #059669; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.45);
    }
    .customer-marker-box {
      padding: 6px 12px; background: #EE4D2D; border-radius: 14px;
      display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800;
      color: #FFF; border: 2.5px solid #FFF; box-shadow: 0 4px 14px rgba(238, 77, 45, 0.4);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="realMap"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const driverCoords = [10.8548, 106.7720];
    const customerCoords = [10.8580, 106.7765];

    const map = L.map('realMap', {
      zoomControl: false,
      attributionControl: false
    }).setView([10.8564, 106.7742], 16);

    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }).addTo(map);

    const driverIcon = L.divIcon({
      className: 'driver-marker-box',
      html: '🛵',
      iconSize: [42, 42],
      iconAnchor: [21, 21]
    });
    L.marker(driverCoords, { icon: driverIcon }).addTo(map);

    const customerIcon = L.divIcon({
      className: 'customer-marker-box',
      html: '📍 An Nguyễn (Q.1)',
      iconSize: [120, 32],
      iconAnchor: [60, 16]
    });
    L.marker(customerCoords, { icon: customerIcon }).addTo(map);

    L.polyline([driverCoords, [10.8560, 106.7735], [10.8572, 106.7750], customerCoords], {
      color: '#059669', weight: 6, opacity: 0.95, lineCap: 'round', lineJoin: 'round'
    }).addTo(map);

    function focusCustomer() {
      map.flyTo(customerCoords, 17, { duration: 1 });
    }
  </script>
</body>
</html>
