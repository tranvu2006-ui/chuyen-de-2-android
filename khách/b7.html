<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oishi Food - Giỏ Hàng Quán</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #EE4D2D;
      --primary-hover: #D73211;
      --bg: #FFFFFF;
      --text: #222222;
      --text-muted: #888888;
      --border: #F0F0F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0F172A; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

    /* Khung giả lập Smartphone */
    .mobile-frame {
      width: 412px; height: 860px; background: #FFF;
      border-radius: 36px; border: 10px solid #1E293B;
      display: flex; flex-direction: column; overflow: hidden; position: relative;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    }

    /* Nền trang chi tiết quán bị làm mờ phía sau */
    .backdrop-bg {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1558857563-b371033873b8?w=700&auto=format&fit=crop&q=80') top/cover no-repeat;
      filter: blur(2px); z-index: 1;
    }

    /* Khung Bottom Sheet Giỏ hàng */
    .cart-sheet {
      position: absolute; bottom: 0; left: 0; right: 0; height: 82%;
      background: #FFFFFF; border-radius: 20px 20px 0 0; z-index: 10;
      display: flex; flex-direction: column; box-shadow: 0 -8px 24px rgba(0,0,0,0.15);
    }

    /* 1. Header Sheet */
    .sheet-header {
      padding: 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .btn-clear {
      font-size: 13px; color: var(--primary); font-weight: 600; cursor: pointer; border: none; background: none;
    }
    .sheet-title {
      font-size: 16px; font-weight: 700; color: var(--text);
    }
    .btn-close {
      font-size: 18px; color: #777; cursor: pointer; border: none; background: none;
    }

    /* 2. Danh sách món trong giỏ */
    .sheet-body {
      flex: 1; overflow-y: auto; padding: 0 16px;
    }
    .cart-item {
      display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid #F5F5F5;
      align-items: flex-start;
    }
    .cart-thumb {
      width: 54px; height: 54px; border-radius: 6px; object-fit: cover; flex-shrink: 0; margin-top: 2px;
    }
    .cart-info { flex: 1; }
    .cart-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .cart-options { font-size: 12px; color: var(--text-muted); margin: 3px 0 6px 0; line-height: 1.4; }
    
    .cart-note-link {
      font-size: 12px; color: #9E9E9E; display: flex; align-items: center; gap: 4px;
      cursor: pointer; text-decoration: none; margin-bottom: 8px;
    }

    .cart-price-qty {
      display: flex; justify-content: space-between; align-items: center;
    }
    .item-price { font-size: 14px; font-weight: 700; color: var(--primary); }

    /* Bộ tăng giảm số lượng */
    .qty-control {
      display: flex; align-items: center; gap: 6px;
    }
    .btn-qty {
      width: 26px; height: 26px; border: 1px solid #E0E0E0; border-radius: 4px;
      background: #FFF; font-weight: 700; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 14px; color: #555;
    }
    .btn-qty.plus {
      background: var(--primary); color: #FFF; border-color: var(--primary);
    }
    .qty-val {
      font-size: 13px; font-weight: 700; min-width: 14px; text-align: center;
    }

    /* Dòng ghi chú chân danh sách */
    .tax-notice {
      font-size: 11px; color: #9E9E9E; padding: 14px 4px; text-align: left;
    }

    /* 3. Footer chốt giỏ hàng */
    .sheet-footer {
      padding: 12px 16px 20px 16px; background: #FFF; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-left {
      display: flex; align-items: center; gap: 14px;
    }
    .cart-icon-btn {
      position: relative; font-size: 26px; cursor: pointer; line-height: 1;
    }
    .badge-count {
      position: absolute; top: -6px; right: -8px; background: var(--primary);
      color: #FFF; font-size: 10px; font-weight: 800; border-radius: 99px;
      padding: 1px 6px; border: 2px solid #FFF;
    }
    .total-price {
      font-size: 18px; font-weight: 800; color: var(--primary);
    }
    .btn-submit {
      background: var(--primary); color: #FFF; border: none; border-radius: 10px;
      padding: 12px 28px; font-size: 15px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-block; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--primary-hover); }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Nền trang chi tiết quán làm mờ -->
    <div class="backdrop-bg"></div>

    <!-- Bottom Sheet Giỏ hàng của quán -->
    <div class="cart-sheet">
      <!-- Header -->
      <div class="sheet-header">
        <button class="btn-clear" onclick="clearAll()">Xóa tất cả</button>
        <span class="sheet-title">Giỏ hàng</span>
        <button class="btn-close" onclick="window.location.href='shop_detail.html'">✕</button>
      </div>

      <!-- Danh sách món đã chọn trong quán -->
      <div class="sheet-body" id="cartBody">
        <!-- Món 1 -->
        <div class="cart-item" id="item1">
          <img class="cart-thumb" src="https://images.unsplash.com/photo-1556881286-fc6915169721?w=200&auto=format&fit=crop&q=60" alt="Trà Xí Muội Ô Long">
          <div class="cart-info">
            <div class="cart-name">Trà Xí Muội Ô Long</div>
            <div class="cart-options">Đá bình thường, Size M, 100% đường</div>
            <div class="cart-note-link">📝 <span>Thêm ghi chú...</span></div>
            <div class="cart-price-qty">
              <span class="item-price">28.000đ</span>
              <div class="qty-control">
                <button class="btn-qty" onclick="changeItemQty(1, -1, 28000)">—</button>
                <span class="qty-val" id="qtyItem1">1</span>
                <button class="btn-qty plus" onclick="changeItemQty(1, 1, 28000)">+</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Món 2 -->
        <div class="cart-item" id="item2">
          <img class="cart-thumb" src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=200&auto=format&fit=crop&q=60" alt="Trà Xí Muội Ngô Gia">
          <div class="cart-info">
            <div class="cart-name">Trà Xí Muội Ngô Gia</div>
            <div class="cart-options">Đá bình thường, Size M</div>
            <div class="cart-note-link">📝 <span>Thêm ghi chú...</span></div>
            <div class="cart-price-qty">
              <span class="item-price">25.000đ</span>
              <div class="qty-control">
                <button class="btn-qty" onclick="changeItemQty(2, -1, 25000)">—</button>
                <span class="qty-val" id="qtyItem2">1</span>
                <button class="btn-qty plus" onclick="changeItemQty(2, 1, 25000)">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="tax-notice">
          Giá món đã bao gồm thuế, nhưng chưa bao gồm phí giao hàng và các phí khác.
        </div>
      </div>

      <!-- Footer chốt đơn sang màn thanh toán -->
      <div class="sheet-footer">
        <div class="footer-left">
          <div class="cart-icon-btn">
            🧺
            <span class="badge-count" id="totalCountBadge">2</span>
          </div>
          <span class="total-price" id="totalPriceDisplay">53.000đ</span>
        </div>
        <!-- Chuyển hướng sang màn hình thanh toán b3.html -->
        <a id="btnNext" href="b8.html?shop=NgoGia&district=ThuDuc&amount=53000" class="btn-submit">
          Tiếp tục
        </a>
      </div>
    </div>
  </div>

  <script>
    let totalPrice = 53000;
    let totalItems = 2;

    function changeItemQty(itemId, delta, itemPrice) {
      const qtyElem = document.getElementById(`qtyItem${itemId}`);
      let currentVal = parseInt(qtyElem.innerText);
      let nextVal = currentVal + delta;

      if (nextVal <= 0) {
        // Xóa món khỏi giỏ nếu giảm về 0
        document.getElementById(`item${itemId}`).remove();
        totalPrice -= itemPrice * currentVal;
        totalItems -= currentVal;
      } else {
        qtyElem.innerText = nextVal;
        totalPrice += delta * itemPrice;
        totalItems += delta;
      }

      updateUI();
    }

    function clearAll() {
      if (confirm("Bạn có chắc chắn muốn xóa toàn bộ món trong giỏ quán này không?")) {
        document.getElementById('cartBody').innerHTML = '<div style="text-align:center;padding:40px;color:#9E9E9E;font-size:13px;">Giỏ hàng của quán đang trống</div>';
        totalPrice = 0;
        totalItems = 0;
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('totalPriceDisplay').innerText = `${totalPrice.toLocaleString('vi-VN')}đ`;
      document.getElementById('totalCountBadge').innerText = totalItems;
      document.getElementById('btnNext').href = `b8.html?shop=NgoGia&district=ThuDuc&amount=${totalPrice}`;
      
      if (totalItems === 0) {
        document.getElementById('btnNext').style.opacity = '0.5';
        document.getElementById('btnNext').style.pointerEvents = 'none';
      }
    }
  </script>

</body>
</html>
